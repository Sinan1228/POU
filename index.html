<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For Pou</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --gold:#f3d9a4; --rose:#ff8fb1; --ink:#2a1b2e; --paper:#fff6e8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:smooth; }
  body {
    font-family:'Poppins',sans-serif; color:#fff; min-height:100vh;
    background:linear-gradient(180deg,#0b0a1f 0%,#1a1038 50%,#3a1646 100%);
    background-attachment:fixed; overflow-x:hidden;
  }
  .star { position:fixed; background:#fff; border-radius:50%; z-index:0; pointer-events:none;
          animation:tw 3s ease-in-out infinite; }
  @keyframes tw { 0%,100%{opacity:.15} 50%{opacity:.95} }

  /* ---------- INTRO ---------- */
  #intro {
    position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; padding:24px;
    background:linear-gradient(180deg,#0b0a1f,#2a1245); transition:opacity 1.2s ease, visibility 1.2s;
  }
  #intro.hide { opacity:0; visibility:hidden; }
  .env { font-size:5rem; animation:bob 2.6s ease-in-out infinite; cursor:pointer; filter:drop-shadow(0 0 25px rgba(255,143,177,.6)); }
  @keyframes bob { 50%{ transform:translateY(-12px) rotate(-3deg);} }
  #intro h1 { font-family:'Caveat',cursive; font-size:3rem; margin-top:14px; color:var(--gold); }
  #intro p { font-weight:300; opacity:.8; margin-top:8px; font-size:.95rem; }
  #intro button {
    margin-top:26px; padding:13px 34px; font:inherit; font-size:.95rem; color:#fff; cursor:pointer;
    border:1.5px solid var(--gold); background:transparent; border-radius:999px; letter-spacing:1px; transition:.3s;
  }
  #intro button:hover { background:rgba(243,217,164,.15); }

  /* ---------- MAIN ---------- */
  main { position:relative; z-index:2; max-width:460px; margin:0 auto; padding:0 18px 80px; }
  section { padding:70px 0 10px; text-align:center; }
  .label { font-size:.7rem; letter-spacing:4px; text-transform:uppercase; color:var(--gold); opacity:.85; }
  h2 { font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:500; font-size:2.2rem; margin:8px 0 22px; }

  .hero { min-height:92vh; display:flex; flex-direction:column; justify-content:center; }
  .names { font-family:'Caveat',cursive; font-size:4.2rem; line-height:1; color:#fff;
           text-shadow:0 0 30px rgba(255,143,177,.6); }
  .names span { color:var(--rose); }
  .sub { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:1.25rem; margin-top:14px; opacity:.9; }
  .scroll { margin-top:40px; font-size:.75rem; letter-spacing:3px; opacity:.6; animation:bob 2.2s infinite; }

  .counter { font-family:'Caveat',cursive; font-size:6rem; line-height:1; color:var(--gold);
             text-shadow:0 0 30px rgba(243,217,164,.45); }
  .counter-l { font-size:.8rem; letter-spacing:3px; text-transform:uppercase; opacity:.8; }
  .clock { display:flex; justify-content:center; gap:10px; margin-top:20px; }
  .clock div { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14);
               border-radius:14px; padding:12px 14px; min-width:70px; }
  .clock b { display:block; font-size:1.5rem; font-weight:400; }
  .clock span { font-size:.6rem; letter-spacing:2px; text-transform:uppercase; opacity:.7; }
  .ymd { margin-top:16px; font-weight:300; opacity:.85; }

  .since {
    margin-top:34px; padding:18px 16px; border-radius:18px;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14);
  }
  .since .n { font-family:'Caveat',cursive; font-size:3rem; color:var(--rose); line-height:1; }
  .since .t { font-size:.78rem; letter-spacing:2px; text-transform:uppercase; opacity:.8; margin-top:4px; }

  /* timeline */
  .tl { position:relative; text-align:left; padding-left:30px; margin-top:10px; }
  .tl::before { content:""; position:absolute; left:8px; top:6px; bottom:6px; width:2px;
                background:linear-gradient(var(--rose),var(--gold)); opacity:.6; }
  .tl-item { position:relative; margin-bottom:38px; opacity:0; transform:translateY(24px); transition:all .8s ease; }
  .tl-item.in { opacity:1; transform:none; }
  .tl-item::before { content:"♥"; position:absolute; left:-30px; top:0; font-size:.95rem; color:var(--rose);
                     background:#1a1038; border-radius:50%; width:18px; text-align:center; }
  .tl-date { font-size:.72rem; letter-spacing:2px; color:var(--gold); text-transform:uppercase; }
  .tl-title { font-family:'Cormorant Garamond',serif; font-size:1.5rem; font-weight:700; margin:2px 0 4px; }
  .tl-text { font-weight:300; line-height:1.65; opacity:.9; font-size:.93rem; }
  .bubble {
    display:inline-block; margin:12px 0 4px; padding:11px 16px; font-size:1.05rem;
    background:#ff8fb1; color:#2a1b2e; border-radius:18px 18px 18px 4px; font-weight:400;
    box-shadow:0 8px 20px rgba(255,143,177,.3);
  }
  .bubble-who { display:block; font-size:.65rem; letter-spacing:1px; opacity:.6; margin-top:3px; }

  /* reasons */
  .reasons { display:grid; gap:12px; }
  .reason {
    padding:18px 16px; border-radius:16px; cursor:pointer; user-select:none;
    background:rgba(255,255,255,.07); border:1px dashed rgba(243,217,164,.45); transition:.4s;
    font-family:'Caveat',cursive; font-size:1.5rem; color:var(--gold);
  }
  .reason.open { background:rgba(255,143,177,.14); border-style:solid; border-color:var(--rose);
                 color:#fff; font-size:1.4rem; line-height:1.4; }

  /* letter */
  .paper {
    background:var(--paper); color:var(--ink); text-align:left; border-radius:6px; padding:30px 24px;
    font-family:'Caveat',cursive; font-size:1.55rem; line-height:1.6; white-space:pre-line;
    box-shadow:0 20px 50px rgba(0,0,0,.5); transform:rotate(-1deg);
    background-image:repeating-linear-gradient(transparent,transparent 38px,rgba(196,69,105,.12) 39px);
  }
  .sign { margin-top:16px; text-align:right; font-family:'Caveat',cursive; font-size:1.9rem; }

  .end { padding:80px 0 20px; text-align:center; font-family:'Cormorant Garamond',serif; font-style:italic; font-size:1.4rem; opacity:.9; }
  .end .big { font-family:'Caveat',cursive; font-size:2.6rem; color:var(--rose); display:block; margin-top:8px; font-style:normal; }

  .heart { position:fixed; bottom:-30px; z-index:1; pointer-events:none; animation:fl linear forwards; opacity:0; }
  @keyframes fl { 0%{transform:translateY(0);opacity:0} 15%{opacity:.7} 100%{transform:translateY(-110vh);opacity:0} }
</style>
</head>
<body>

<!-- INTRO -->
<div id="intro">
  <div class="env" id="envBtn">💌</div>
  <h1 id="introTitle"></h1>
  <p>Something I made, only for you.</p>
  <button id="openBtn">Open</button>
</div>

<main id="main">

  <section class="hero">
    <div class="label">A little corner of the internet</div>
    <div class="names" id="names" style="margin-top:14px"></div>
    <div class="sub" id="tagline"></div>
    <div class="scroll">SCROLL ↓</div>
  </section>

  <section>
    <div class="label">Since we became us</div>
    <h2>Our time</h2>
    <div class="counter" id="days">0</div>
    <div class="counter-l">days together</div>
    <div class="clock">
      <div><b id="h">0</b><span>hours</span></div>
      <div><b id="m">0</b><span>min</span></div>
      <div><b id="s">0</b><span>sec</span></div>
    </div>
    <div class="ymd" id="ymd"></div>

    <div class="since">
      <div class="n" id="talkDays">0</div>
      <div class="t" id="talkLabel"></div>
    </div>
  </section>

  <section>
    <div class="label">Remember when</div>
    <h2>Our story</h2>
    <div class="tl" id="tl"></div>
  </section>

  <section>
    <div class="label">Tap each one</div>
    <h2>Why it's you</h2>
    <div class="reasons" id="reasons"></div>
  </section>

  <section>
    <div class="label">One more thing</div>
    <h2>A letter</h2>
    <div class="paper" id="letter"></div>
    <div class="sign" id="sign"></div>
  </section>

  <div class="end">
    <div id="endLine"></div>
    <span class="big" id="endBig"></span>
  </div>

</main>

<script>
/* =====================================================
   ✏️ EDIT ONLY THIS PART. Make it yours, write it in
   your own words, add real dates and real memories.
   ===================================================== */
const CONFIG = {
  her: "Pou",
  you: "Sin",

  talkStart: "2025-09-18T00:00:00",   // the day she texted you first
  start:     "2026-01-01T00:00:00",   // the day you got committed

  tagline: "It started with one text. I'm so glad you sent it.",

  moments: [
    {
      date: "18 September 2025",
      title: "The text that started it all",
      text: "I put up a status, and you replied. I didn't know it then, but that one message changed everything.",
      bubble: "Secretary🤌😮‍💨",
      bubbleWho: "Pou, replying to my status"
    },
    {
      date: "1 January 2026",
      title: "We made it official",
      text: "New year, new chapter. This was the day we stopped being almost and started being us."
    },
    {
      date: "Today",
      title: "Still choosing you",
      text: "And every single day since, I've picked you again."
    }
    /* To add a new memory, copy a block above, put a comma after the previous one,
       and change the date, title and text. */
  ],

  reasons: [
    "You started it all with one text.",
    "You make me laugh even on my worst days.",
    "With you, ordinary days feel special.",
    "Add your own reason here.",
    "Add another one here."
  ],

  letter: "Pou,\n\nIt all began with a reply to my status. Funny how something so small turned into the best thing in my life.\n\nI'm not great with big words, so I built this for you instead. Every day you see on that counter is a day I'm grateful for.\n\nThank you for being you.\n\nI love you.",

  endLine: "No matter where life takes us,",
  endBig:  "I choose you. Always."
};
/* ===================================================== */

const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");

/* fill text */
document.title = "For " + CONFIG.her;
$("introTitle").textContent = "For " + CONFIG.her;
$("names").innerHTML = CONFIG.you + ' <span>&amp;</span> ' + CONFIG.her;
$("tagline").textContent = CONFIG.tagline;
$("letter").textContent = CONFIG.letter;
$("sign").textContent = "Yours, " + CONFIG.you;
$("endLine").textContent = CONFIG.endLine;
$("endBig").textContent = CONFIG.endBig;

/* timeline */
CONFIG.moments.forEach((m) => {
  const d = document.createElement("div");
  d.className = "tl-item";
  const date = document.createElement("div"); date.className = "tl-date"; date.textContent = m.date;
  const title = document.createElement("div"); title.className = "tl-title"; title.textContent = m.title;
  d.appendChild(date); d.appendChild(title);
  if (m.bubble) {
    const b = document.createElement("div"); b.className = "bubble"; b.textContent = m.bubble;
    if (m.bubbleWho) {
      const w = document.createElement("span"); w.className = "bubble-who"; w.textContent = m.bubbleWho;
      b.appendChild(w);
    }
    d.appendChild(b);
  }
  const text = document.createElement("div"); text.className = "tl-text"; text.textContent = m.text;
  d.appendChild(text);
  $("tl").appendChild(d);
});
const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) e.target.classList.add("in"); }), { threshold: .2 });
document.querySelectorAll(".tl-item").forEach((el) => io.observe(el));

/* reasons */
CONFIG.reasons.forEach((r, i) => {
  const d = document.createElement("div");
  d.className = "reason";
  d.textContent = "Reason #" + (i + 1) + "  ♡";
  d.onclick = () => {
    const open = d.classList.toggle("open");
    d.textContent = open ? r : "Reason #" + (i + 1) + "  ♡";
  };
  $("reasons").appendChild(d);
});

/* counters */
const start = new Date(CONFIG.start);
const talkStart = new Date(CONFIG.talkStart);
const talkText = talkStart.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
$("talkLabel").textContent = "days since you first texted me, " + talkText;

function ymd(a, b) {
  let y = b.getFullYear() - a.getFullYear(), m = b.getMonth() - a.getMonth(), d = b.getDate() - a.getDate();
  if (d < 0) { m--; d += new Date(b.getFullYear(), b.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }
  return y + " years, " + m + " months, " + d + " days";
}
function tick() {
  const now = new Date(), ms = now - start;
  $("days").textContent = Math.max(0, Math.floor(ms / 864e5)).toLocaleString();
  $("h").textContent = pad(Math.max(0, Math.floor(ms / 36e5) % 24));
  $("m").textContent = pad(Math.max(0, Math.floor(ms / 6e4) % 60));
  $("s").textContent = pad(Math.max(0, Math.floor(ms / 1e3) % 60));
  $("ymd").textContent = ms > 0 ? ymd(start, now) : "";
  $("talkDays").textContent = Math.max(0, Math.floor((now - talkStart) / 864e5)).toLocaleString();
}
tick(); setInterval(tick, 1000);

/* stars */
for (let i = 0; i < 70; i++) {
  const s = document.createElement("div");
  s.className = "star";
  const z = Math.random() * 2.2 + .6;
  s.style.cssText = "width:" + z + "px;height:" + z + "px;left:" + Math.random() * 100 + "vw;top:" +
    Math.random() * 100 + "vh;animation-delay:" + Math.random() * 3 + "s;animation-duration:" + (2 + Math.random() * 3) + "s";
  document.body.appendChild(s);
}

/* hearts */
function heart() {
  const h = document.createElement("div");
  h.className = "heart";
  h.textContent = ["♥", "♡", "✦"][Math.floor(Math.random() * 3)];
  h.style.color = Math.random() > .5 ? "#ff8fb1" : "#f3d9a4";
  h.style.left = Math.random() * 100 + "vw";
  h.style.fontSize = 12 + Math.random() * 18 + "px";
  h.style.animationDuration = 8 + Math.random() * 6 + "s";
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 15000);
}
setInterval(heart, 1100);

/* open intro */
function openIt() { $("intro").classList.add("hide"); window.scrollTo(0, 0); }
$("openBtn").onclick = openIt;
$("envBtn").onclick = openIt;
</script>
</body>
</html>
